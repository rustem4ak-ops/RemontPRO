name: RemontPRO AutoSearch 24/7
# Lead radar: public Telegram + verified Kazan communities

on:
  push:
    paths:
      - 'scripts/autosearch.mjs'
      - 'shared/autosearch.cjs'
      - '.github/workflows/autosearch.yml'
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan public sources
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_ADMIN_CHAT_ID: ${{ secrets.MAX_ADMIN_CHAT_ID }}
        run: node scripts/autosearch.mjs
      - name: Save results
        run: |
          git config user.name "RemontPRO AutoSearch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/autosearch.json site/autosearch-data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update AutoSearch leads"
            git pull --rebase origin main
  git push
          fi
