name: RemontPRO AutoSearch 24/7

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan public sources
        run: node scripts/autosearch.mjs
      - name: Save results
        run: |
          git config user.name "RemontPRO AutoSearch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/autosearch.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update AutoSearch leads"
            git push
          fi
