name: Restore site media

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-site-media.yml'
      - 'tools/patch_site_media.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch site
        run: python tools/patch_site_media.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix: restore site photos and portfolio fallback"
            git push
          fi
