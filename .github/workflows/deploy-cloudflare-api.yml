name: Deploy Cloudflare API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare-worker/**"
      - "shared/remontforma-pricing.js"
      - ".github/workflows/deploy-cloudflare-api.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy Worker
        run: npx --yes wrangler deploy --config cloudflare-worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
