name: Manual portfolio sync (disabled by default)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-portfolio.yml'
      - 'site/index.html'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write


jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image optimizer
        run: python3 -m pip install --user pillow -q

      - name: Download portfolio from Yandex Disk (manual only)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/assets/portfolio
          mkdir -p site/assets/portfolio
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request, io
          API='https://cloud-api.yandex.net/v1/disk/public/resources'
          KEY='https://disk.yandex.ru/d/X4VLvyoCDpNVYA'
          out=[]
          seen=set()
          def get(path):
              q=urllib.parse.urlencode({'public_key':KEY,'path':path,'limit':'1000','preview_size':'XXXL'})
              req=urllib.request.Request(API+'?'+q,headers={'User-Agent':'RemontFormaPortfolio/7.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)
          def walk(path,album):
              data=get(path)
              for item in (data.get('_embedded') or {}).get('items',[]):
                  p=(path.rstrip('/')+'/'+item['name']) if path!='/' else '/'+item['name']
                  if item.get('type')=='dir':
                      walk(p,item['name'])
                  elif item.get('type')=='file' and re.match(r'^image/',item.get('mime_type',''),re.I):
                      url=item.get('file') or item.get('preview')
                      if not url:
                          continue
                      name=item['name']
                      safe=re.sub(r'[^A-Za-z0-9._-]+','_',name)
                      ext='.webp'
                      base=os.path.splitext(safe)[0]
                      dest=os.path.join('site/assets/portfolio',base+ext)
                      n=2
                      while dest in seen or os.path.exists(dest):
                          dest=os.path.join('site/assets/portfolio',f'{base}_{n}{ext}')
                          n+=1
                      seen.add(dest)
                      try:
                          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                          with urllib.request.urlopen(req,timeout=60) as r:
                              raw=r.read()
                          from PIL import Image, ImageOps
                          im=Image.open(io.BytesIO(raw))
                          # Принудительно применяем EXIF Orientation и сохраняем уже физически повернутый кадр.
                          # Это убирает боковые/перевернутые фото на iPhone и GitHub Pages.
                          im=ImageOps.exif_transpose(im).convert('RGB')
                          im.thumbnail((1400,1400),Image.Resampling.LANCZOS)
                          im.save(dest,'WEBP',quality=72,method=6)
                          out.append({'name':name,'album':album or 'Реализованные ремонты','url':'./assets/portfolio/'+os.path.basename(dest)})
                      except Exception as e:
                          print('skip',p,e)
                          try: os.remove(dest)
                          except: pass
          walk('/','Реализованные ремонты')
          print('downloaded',len(out))
          if not out:
              raise SystemExit('No portfolio images downloaded')
          open('site/assets/portfolio/portfolio.json','w',encoding='utf-8').write(json.dumps({'ok':True,'count':len(out),'images':out},ensure_ascii=False,indent=2))
          PY

      - name: Make GitHub Pages use local portfolio first
        run: echo "site/index.html already uses local portfolio assets"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit portfolio photos (manual only)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/portfolio
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore real portfolio photos for GitHub Pages"
          git push
