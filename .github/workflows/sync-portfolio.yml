name: Sync portfolio photos from Yandex Disk

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download portfolio from Yandex Disk
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/assets/portfolio
          mkdir -p site/assets/portfolio
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.parse, urllib.request
          API='https://cloud-api.yandex.net/v1/disk/public/resources'
          KEY='https://disk.yandex.ru/d/X4VLvyoCDpNVYA'
          out=[]
          seen=set()
          def get(path):
              q=urllib.parse.urlencode({'public_key':KEY,'path':path,'limit':'1000','preview_size':'XXXL'})
              req=urllib.request.Request(API+'?'+q,headers={'User-Agent':'RemontFormaPortfolio/6.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)
          def walk(path,album):
              data=get(path)
              for item in (data.get('_embedded') or {}).get('items',[]):
                  p=(path.rstrip('/')+'/'+item['name']) if path!='/' else '/'+item['name']
                  if item.get('type')=='dir':
                      walk(p,item['name'])
                  elif item.get('type')=='file' and re.match(r'^image/',item.get('mime_type',''),re.I):
                      url=item.get('file') or item.get('preview')
                      if not url:
                          continue
                      name=item['name']
                      safe=re.sub(r'[^A-Za-z0-9._-]+','_',name)
                      base=os.path.splitext(safe)[0]
                      dest=os.path.join('site/assets/portfolio',base+'.jpg')
                      if dest in seen: continue
                      seen.add(dest)
                      try:
                          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                          with urllib.request.urlopen(req,timeout=60) as r:
                              raw=r.read()
                          tmp=dest+'.src'
                          open(tmp,'wb').write(raw)
                          subprocess.run(['convert',tmp,'-auto-orient','-resize','1600x1600>','-strip','-quality','80',dest],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                          os.remove(tmp)
                          out.append({'name':name,'album':album or 'Реализованные ремонты','url':'./assets/portfolio/'+os.path.basename(dest)})
                      except Exception as e:
                          print('skip',p,e)
                          try: os.remove(dest+'.src')
                          except: pass
          walk('/','Реализованные ремонты')
          print('downloaded',len(out))
          if not out:
              raise SystemExit('No portfolio images downloaded')
          open('site/assets/portfolio/portfolio.json','w',encoding='utf-8').write(json.dumps({'ok':True,'count':len(out),'images':out},ensure_ascii=False,indent=2))
          PY

      - name: Commit portfolio photos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/portfolio
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore real portfolio photos for GitHub Pages"
          git push
