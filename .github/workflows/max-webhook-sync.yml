name: Sync MAX webhook

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Register MAX webhook
        run: |
          set -e
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 5 \
            https://remont-pro-nine.vercel.app/api/max-setup
