name: Publish РЕМОНТФОРМА to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Ensure portfolio JPEG asset
        run: |
          mkdir -p site/assets/portfolio
          curl -fsSL --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/rustem4ak-ops/RemontPRO/047a754dc1fca9a8c5b507afb28011966ed6f8bc/site/assets/portfolio/remontforma-collage.jpg" \
            -o site/assets/portfolio/remontforma-collage.jpg
          file site/assets/portfolio/remontforma-collage.jpg
          test -s site/assets/portfolio/remontforma-collage.jpg

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
